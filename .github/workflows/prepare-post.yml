name: Prepare Post for Review

on:
  schedule:
    - cron: "5 * * * *"  # 毎時5分に、予定時刻を過ぎていないかチェック
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate candidate and open review issue
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/prepare_post.py

      - name: Commit schedule state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          git diff --staged --quiet || git commit -m "Mark schedule slot as prepared"
          git push
